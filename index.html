<body>

    <!-- FIREBASE & LÓGICA DE INTEGRACIÓN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDH4yJZOodA_bLfZ-13j-69B6lGYlD411E",
            authDomain: "data-4f604.firebaseapp.com",
            projectId: "data-4f604",
            storageBucket: "data-4f604.firebasestorage.app",
            messagingSenderId: "186125262351",
            appId: "1:186125262351:web:a38416e752f52eda404d7a"
        };

        const app = initializeApp(firebaseConfig);
        const dbFirestore = getFirestore(app);
        const storage = getStorage(app);
        const dbRef = doc(dbFirestore, "sincronizacion", "datos_activos_v2");

        // 1. Función para subir archivos grandes a Firebase Storage
        window.subirArchivoAStorage = async (file, pathPrefix) => {
            const storageRef = ref(storage, `${pathPrefix}/${Date.now()}_${file.name}`);
            const uploadTask = uploadBytesResumable(storageRef, file);

            return new Promise((resolve, reject) => {
                uploadTask.on('state_changed', 
                    (snapshot) => {
                        const progreso = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                        console.log(`Progreso: ${progreso.toFixed(2)}%`);
                    },
                    (error) => reject(error),
                    async () => {
                        const url = await getDownloadURL(uploadTask.snapshot.ref);
                        resolve(url);
                    }
                );
            });
        };

        // 2. Sincronización automática de base de datos
        window.sincronizarNube = async function(localDb) {
            try {
                await setDoc(dbRef, { data: JSON.stringify(localDb), timestamp: new Date().toISOString() });
            } catch (e) { console.error("Error nube:", e); }
        };

        // 3. Listener para que otros dispositivos se actualicen
        onSnapshot(dbRef, (docSnap) => {
            if (docSnap.exists()) {
                const cloudData = docSnap.data().data;
                const localData = localStorage.getItem("data_control_activos_db_v4");
                if (cloudData && cloudData !== localData) {
                    localStorage.setItem("data_control_activos_db_v4", cloudData);
                    location.reload(); // Recarga para aplicar cambios en tiempo real
                }
            }
        });
    </script>

    <script>
        /* INTEGRACIÓN EN TUS FUNCIONES DE SUBIDA */
        async function uploadInstructionImages(e) {
            if (currentRole !== 'admin') return;
            let files = e.target.files;
            let db = getDatabase(); 
            let mach = db[currentLine].find(m => m.id === currentMachineId);

            for (let file of files) {
                // Se sube a Firebase y obtenemos la URL
                const url = await window.subirArchivoAStorage(file, `instrucciones/${currentMachineId}`);
                if (!mach.instructionImages) mach.instructionImages = [];
                mach.instructionImages.push(url);
            }
            saveDatabase(db);
            loadInstructionsData();
        }

        async function uploadManualsPdf(e) {
            if (currentRole !== 'admin') return;
            let files = e.target.files;
            let db = getDatabase(); 
            let mach = db[currentLine].find(m => m.id === currentMachineId);

            for (let file of files) {
                const url = await window.subirArchivoAStorage(file, `manuales/${currentMachineId}`);
                if (!mach.manualsPdf) mach.manualsPdf = [];
                mach.manualsPdf.push({ name: file.name, data: url });
            }
            saveDatabase(db);
            loadManualsData();
        }

        // Resto de tu lógica (getDatabase, saveDatabase, etc.) igual a tu original...
    </script>
